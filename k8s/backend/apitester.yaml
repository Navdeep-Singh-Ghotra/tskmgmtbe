apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-tester
  namespace: database
  labels:
    app: api-tester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-tester
  template:
    metadata:
      labels:
        app: api-tester
    spec:
      containers:
      - name: api-tester
        image: curlimages/curl:latest
        command: ["sh", "-c"]  # Keeps pod running
        args:
            - |
              echo "Starting API test..."
          
              # Test POST request
              response=$(curl -s -w "\nSTATUS_CODE:%{http_code}" \
                -X POST http://nodeapp-service/api/users \
                -H "Content-Type: application/json" \
                -d '{"name":"gsj","email":"lala@test.com","password":"12345678"}')
              
              # Extract status code and body
              body=$(echo "$response" | grep -v STATUS_CODE)
              status_code=$(echo "$response" | grep STATUS_CODE | cut -d':' -f2)
              
              echo "=== RESPONSE ==="
              echo "Status Code: $status_code"
              echo "Response Body:"
              echo "$body" | jq . 2>/dev/null || echo "$body"
              
              # Exit with error if not 2xx status
              if [[ $status_code -lt 200 || $status_code -gt 299 ]]; then
                echo "ERROR: Request failed with status $status_code"
                exit 1
              else
                echo "SUCCESS: Request completed successfully"
              fi
              
              # Keep container running
              sleep infinity

        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
