apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodeapp
  template:
    metadata:
      labels:
        app: nodeapp
    spec:
      containers:
      - name: nodeapp
        image: navdeepsinghghotra/tskmgmtbe:6  # Build this locally first
        ports:
        - containerPort: 5000
        env:
        - name: MONGODB_URI
          valueFrom:
            configMapKeyRef:
              name: config
              key:  MONGODB_URI
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: config
              key:  PORT
          
---
apiVersion: v1
kind: Service
metadata:
  name: nodeapp-service
spec:
  selector:
    app: nodeapp
  ports:
  - name: http
    port: 80          # External service port
    targetPort: 5003  # Must match containerPort
    protocol: TCP
  type: ClusterIP